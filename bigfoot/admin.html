<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c1410">
<meta name="robots" content="noindex">
<meta name="description" content="Review Bigfoot reports before they appear on the map.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bigfoot">
<title>Review reports — Bigfoot Sightings</title>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="mark"><img src="footprint.svg" alt=""></div>
  <div class="grow">
    <h1>Review reports</h1>
    <p>Only the owner can approve these</p>
  </div>
  <a href="./">Map</a>
</header>
<p id="banner" class="banner" role="status" hidden></p>
<main class="page">
  <section id="signed-out">
    <h2>Sign in</h2>
    <p class="who">Use the email that was saved as the admin. We'll send you a link. No password.</p>
    <form id="sign-in" novalidate>
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" inputmode="email" placeholder="you@email.com">
      <p id="sign-error" class="error" hidden></p>
      <div class="form-actions">
        <button type="submit" id="sign-button" class="btn primary">Email me a sign-in link</button>
      </div>
    </form>
    <p id="sign-note" class="notice" hidden></p>
  </section>
  <section id="signed-in" hidden>
    <div class="signed">
      <p id="who" class="who"></p>
      <button type="button" id="sign-out" class="btn">Sign out</button>
    </div>
    <p id="admin-note" class="notice" hidden></p>
    <div id="queue" hidden>
      <div class="seg" role="tablist">
        <button type="button" id="tab-pending" class="btn primary">Pending</button>
        <button type="button" id="tab-approved" class="btn">On the map</button>
      </div>
      <p id="queue-status" class="hint" role="status"></p>
      <div id="queue-list"></div>
    </div>
  </section>
</main>
<script src="vendor/supabase/supabase.js"></script>
<script src="config.js"></script>
<script type="module" src="admin.js"></script>
</body>
</html>
